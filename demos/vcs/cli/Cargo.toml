[package]
name = "vcs"
version = "0.1.0"
edition = "2021"
description = "A small local-first version control system with an AshCell server"

[lib]
name = "vcs"
path = "src/lib.rs"

[[bin]]
name = "vcs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
ureq = { version = "2", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
