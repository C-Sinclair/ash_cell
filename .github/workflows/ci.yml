name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install MinIO
        run: |
          curl -fsSL -o /usr/local/bin/minio https://dl.min.io/server/minio/release/linux-amd64/minio
          curl -fsSL -o /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x /usr/local/bin/minio /usr/local/bin/mc

      # Seventeen tests fail without a reachable object store, deliberately: they
      # test conditional-write semantics, and a mock would only confirm our own
      # reading of them. So the store comes up before the suite, not per test.
      - name: Start MinIO
        run: scripts/minio.sh

      - run: mix deps.get

      - run: mix format --check-formatted

      # Warnings are errors here and not locally, so a warning introduced in a
      # refactor cannot ride along unnoticed in a green run.
      - run: mix compile --warnings-as-errors

      - run: mix test

  links:
    name: Markdown links
    runs-on: ubuntu-latest

    # The ADRs cross-link each other heavily, and the whole point of an index is that its links
    # work -- a rename that quietly breaks them leaves a set of docs that looks fine and cannot
    # be navigated. Local links only: link_verifier skips http(s) by design, so this proves paths
    # resolve, not that the web is up.
    steps:
      - uses: actions/checkout@v7

      - name: Install link_verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo C-Sinclair/link_verifier \
            --pattern 'link_verifier-linux-x86_64' \
            --output /usr/local/bin/link_verifier
          chmod +x /usr/local/bin/link_verifier
          link_verifier --version

      # `doc/` is generated ex_doc output and gitignored; `cli/target` is a Rust build directory.
      #
      # The find is not redundant. link_verifier skips hidden directories when walking a tree, and
      # refuses one as an explicit target, so `.github` markdown is invisible to the plain scan.
      # Naming those files is the only way to cover them.
      - name: Check links
        run: |
          link_verifier . $(find .github -name '*.md') \
            -x '/deps/' -x '/_build/' -x '/node_modules/' \
            -x '/doc/' -x 'cli/target/'

  cipher:
    name: SQLCipher
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install SQLCipher
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev

      # Its own job, with no cache shared with `test`, because the thing being
      # checked is what exqlite linked against *at compile time*. A cached build
      # from the plain-SQLite job would answer the wrong question, and answering
      # it wrongly is the exact failure mode `mix cipher.check` exists to catch:
      # a missing EXQLITE_USE_SYSTEM silently yields plain SQLite that cannot
      # open an encrypted database.
      - name: Compile exqlite against SQLCipher
        env:
          EXQLITE_USE_SYSTEM: "1"
          EXQLITE_SYSTEM_CFLAGS: "-I/usr/include/sqlcipher"
          EXQLITE_SYSTEM_LDFLAGS: "-lsqlcipher"
        run: |
          mix deps.get
          # See the note in the demo jobs: forcing exqlite alone on a fresh checkout kills
          # Mix's deps partition, because exqlite's build dependencies are not compiled yet.
          mix deps.compile
          mix deps.compile exqlite --force

      - name: Check SQLCipher is linked
        run: mix cipher.check

  durability-barrier:
    name: Durability barrier (ADR-20 tier 1)
    runs-on: ubuntu-latest

    # Asserts that an acknowledged COMMIT requested a WAL barrier before it
    # returned -- and, in the other direction, that `:normal` does not, so a green
    # run cannot come from a trace that captured nothing.
    #
    # Its own job, and Linux-only by necessity. The test needs LD_PRELOAD to reach
    # beam.smp, and macOS strips DYLD_INSERT_LIBRARIES under SIP before the BEAM
    # starts, so a developer on a Mac runs this in Docker while CI runs it
    # natively. No MinIO: durability here is local fsync, nothing to do with the
    # object store.
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - run: scripts/barrier_test.sh --native

  demo-collab-editor:
    name: Demo — collaborative editor
    runs-on: ubuntu-latest

    # The demo is the only place several claims are checked end to end: that a cell
    # cut at a record still works, that the SQLCipher key really is applied, and
    # that compaction stays safe under concurrent writers. A change to the library
    # that breaks any of those is a change that breaks the demo, so it fails here
    # rather than the next time somebody opens it.
    env:
      # The demo asserts its own plaintext is absent from the cell file, which is
      # only true with SQLCipher linked in. A missing variable here fails silently
      # in exqlite and loudly in `encryption_test.exs` — which is the point.
      EXQLITE_USE_SYSTEM: "1"
      EXQLITE_SYSTEM_CFLAGS: "-I/usr/include/sqlcipher"
      EXQLITE_SYSTEM_LDFLAGS: "-lsqlcipher"
      PORT: "4010"

    steps:
      # Checked out as siblings, because the demo depends on both this repo and the
      # fork by relative path (`../..` and `../../../ash_sqlite`) exactly as a local
      # workspace does. Testing it against published hex packages instead would stop
      # testing the change in front of us.
      - uses: actions/checkout@v7
        with:
          path: ash_cell

      - uses: actions/checkout@v7
        with:
          repository: C-Sinclair/ash_sqlite
          ref: main
          path: ash_sqlite

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: ash_cell/.tool-versions
          version-type: strict

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install SQLCipher
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            ash_cell/demos/collab_editor/deps
            ash_cell/demos/collab_editor/_build
          key: ${{ runner.os }}-demo-collab-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('ash_cell/demos/collab_editor/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-demo-collab-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Fetch dependencies
        working-directory: ash_cell/demos/collab_editor
        run: mix deps.get

      # Forced, because a cached build may hold an exqlite compiled without
      # SQLCipher and the cache key cannot see which one it is.
      - name: Compile exqlite against SQLCipher
        working-directory: ash_cell/demos/collab_editor
        # `mix deps.compile` first is load-bearing, not belt-and-braces. On a fresh checkout
        # `mix deps.compile exqlite --force` fans out across Mix's parallel deps partition, and
        # the workers cannot find exqlite's own build dependencies -- `elixir_make`, `telemetry`
        # -- because nothing has compiled them yet, so the partition dies and takes the build
        # with it. Compiling everything once puts them in place.
        run: |
          mix deps.compile
          mix deps.compile exqlite --force

      - name: Check formatting
        working-directory: ash_cell/demos/collab_editor
        run: mix format --check-formatted

      - name: Compile
        working-directory: ash_cell/demos/collab_editor
        env:
          MIX_ENV: test
        run: mix compile --warnings-as-errors

      # Ordering under concurrent compaction, isolation between documents,
      # encryption at rest, and the LiveView wire path.
      - name: Test
        working-directory: ash_cell/demos/collab_editor
        run: mix test

      # `assets.setup` also downloads the esbuild and tailwind binaries, which a
      # clean runner does not have — and both installers are dev-only deps, so this
      # has to run in dev rather than test.
      - name: Install JS toolchain and dependencies
        working-directory: ash_cell/demos/collab_editor
        env:
          MIX_ENV: dev
        run: mix assets.setup

      - name: Install Chromium
        working-directory: ash_cell/demos/collab_editor/assets
        run: npx playwright install --with-deps chromium

      - name: Build assets
        working-directory: ash_cell/demos/collab_editor
        env:
          MIX_ENV: dev
        run: mix assets.build

      # The claim that two people typing in the same paragraph lose nothing cannot
      # be checked from Elixir: an earlier design passed the whole suite above and
      # still dropped keystrokes once two real editors were typing at once.
      - name: Start the server
        working-directory: ash_cell/demos/collab_editor
        env:
          MIX_ENV: dev
        run: |
          mix phx.server > /tmp/collab-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://127.0.0.1:$PORT/"; then exit 0; fi
            sleep 2
          done
          echo "server did not come up on port $PORT"
          cat /tmp/collab-server.log
          exit 1

      - name: Two-browser convergence test
        working-directory: ash_cell/demos/collab_editor
        run: node test/browser/convergence.mjs

      - name: Server log
        if: failure()
        run: cat /tmp/collab-server.log

  demo-console:
    name: Demo — console (compiles)
    runs-on: ubuntu-latest

    # Compile only. The console demo's suite needs Postgres, MinIO and a seeded
    # dataset, and its own tests are the generator's; what breaks it in practice is
    # the library renaming something underneath it. That is a compile error, and
    # this job exists because it happened: `Replicator.latest_generation/2` became
    # `latest_txid/2` and the demo went on referring to the old name for a while
    # with nothing to notice.
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7
        with:
          path: ash_cell

      - uses: actions/checkout@v7
        with:
          repository: C-Sinclair/ash_sqlite
          ref: main
          path: ash_sqlite

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: ash_cell/.tool-versions
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            ash_cell/demos/console/deps
            ash_cell/demos/console/_build
          key: ${{ runner.os }}-demo-console-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('ash_cell/demos/console/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-demo-console-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Fetch dependencies
        working-directory: ash_cell/demos/console
        run: mix deps.get

      - name: Check formatting
        working-directory: ash_cell/demos/console
        run: mix format --check-formatted

      - name: Compile
        working-directory: ash_cell/demos/console
        run: mix compile --warnings-as-errors

  demo-rollout:
    name: Demo — rollout
    runs-on: ubuntu-latest

    # Runs its suite rather than only compiling, because the demo is where the read
    # cache's invalidation is checked against a real resolve path. `read_cache_test`
    # pins the rules in isolation; only this suite drives the interleaving that
    # matters — a manifest built before a promotion and published after it — through
    # the whole of Ash.
    env:
      MIX_ENV: test
      EXQLITE_USE_SYSTEM: "1"
      EXQLITE_SYSTEM_CFLAGS: "-I/usr/include/sqlcipher"
      EXQLITE_SYSTEM_LDFLAGS: "-lsqlcipher"

    steps:
      - uses: actions/checkout@v7
        with:
          path: ash_cell

      - uses: actions/checkout@v7
        with:
          repository: C-Sinclair/ash_sqlite
          ref: main
          path: ash_sqlite

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: ash_cell/.tool-versions
          version-type: strict

      - name: Install SQLCipher
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            ash_cell/demos/rollout/deps
            ash_cell/demos/rollout/_build
          key: ${{ runner.os }}-demo-rollout-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('ash_cell/demos/rollout/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-demo-rollout-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Fetch dependencies
        working-directory: ash_cell/demos/rollout
        run: mix deps.get

      - name: Compile exqlite against SQLCipher
        working-directory: ash_cell/demos/rollout
        # `mix deps.compile` first is load-bearing, not belt-and-braces. On a fresh checkout
        # `mix deps.compile exqlite --force` fans out across Mix's parallel deps partition, and
        # the workers cannot find exqlite's own build dependencies -- `elixir_make`, `telemetry`
        # -- because nothing has compiled them yet, so the partition dies and takes the build
        # with it. Compiling everything once puts them in place.
        run: |
          mix deps.compile
          mix deps.compile exqlite --force

      - name: Check formatting
        working-directory: ash_cell/demos/rollout
        run: mix format --check-formatted

      - name: Compile
        working-directory: ash_cell/demos/rollout
        run: mix compile --warnings-as-errors

      - name: Test
        working-directory: ash_cell/demos/rollout
        run: mix test

  demo-vcs:
    name: Demo — vcs
    runs-on: ubuntu-latest

    # The only demo with a non-Elixir half, and the only one whose central claim cannot be
    # checked from `mix test`: that a losing push is refused. That needs the real binary
    # talking to a listening server, so this job runs `scripts/e2e.sh` as well as both
    # suites. It also runs the `:minio` tests, which are excluded by default — the
    # snapshotter's fencing is the reason they exist.
    env:
      MIX_ENV: test
      EXQLITE_USE_SYSTEM: "1"
      EXQLITE_SYSTEM_CFLAGS: "-I/usr/include/sqlcipher"
      EXQLITE_SYSTEM_LDFLAGS: "-lsqlcipher"

    steps:
      - uses: actions/checkout@v7
        with:
          path: ash_cell

      - uses: actions/checkout@v7
        with:
          repository: C-Sinclair/ash_sqlite
          ref: main
          path: ash_sqlite

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: ash_cell/.tool-versions
          version-type: strict

      - uses: dtolnay/rust-toolchain@stable

      - name: Install SQLCipher
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev

      - name: Install MinIO
        run: |
          curl -fsSL -o /usr/local/bin/minio https://dl.min.io/server/minio/release/linux-amd64/minio
          curl -fsSL -o /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x /usr/local/bin/minio /usr/local/bin/mc

      # The demo's test config defaults to the same endpoint, bucket, and credentials as the
      # library's, so the library's script is what brings the store up here too.
      - name: Start MinIO
        working-directory: ash_cell
        run: scripts/minio.sh

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            ash_cell/demos/vcs/deps
            ash_cell/demos/vcs/_build
            ash_cell/demos/vcs/cli/target
          key: ${{ runner.os }}-demo-vcs-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('ash_cell/demos/vcs/mix.lock', 'ash_cell/demos/vcs/cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-demo-vcs-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Fetch dependencies
        working-directory: ash_cell/demos/vcs
        run: mix deps.get

      - name: Compile exqlite against SQLCipher
        working-directory: ash_cell/demos/vcs
        # `mix deps.compile` first is load-bearing, not belt-and-braces. On a fresh checkout
        # `mix deps.compile exqlite --force` fans out across Mix's parallel deps partition, and
        # the workers cannot find exqlite's own build dependencies -- `elixir_make`, `telemetry`
        # -- because nothing has compiled them yet, so the partition dies and takes the build
        # with it. Compiling everything once puts them in place.
        run: |
          mix deps.compile
          mix deps.compile exqlite --force

      # The e2e script asserts the cell file carries no plaintext, which is only true with
      # SQLCipher linked in. A missing variable above fails silently in exqlite, so assert it
      # here rather than letting the script report it as a mysterious plaintext hit.
      - name: Check SQLCipher is linked
        working-directory: ash_cell/demos/vcs
        run: mix cipher.check

      - name: Check formatting
        working-directory: ash_cell/demos/vcs
        run: mix format --check-formatted

      - name: Compile
        working-directory: ash_cell/demos/vcs
        run: mix compile --warnings-as-errors

      - name: Check the client's formatting
        working-directory: ash_cell/demos/vcs/cli
        run: cargo fmt --check

      - name: Lint the client
        working-directory: ash_cell/demos/vcs/cli
        run: cargo clippy --all-targets -- -D warnings

      - name: Test the client
        working-directory: ash_cell/demos/vcs/cli
        run: cargo test

      - name: Test the server
        working-directory: ash_cell/demos/vcs
        run: mix test --include minio

      - name: End to end — two clones and a losing push
        working-directory: ash_cell/demos/vcs
        run: scripts/e2e.sh

  demo-shroud:
    name: Demo — shroud
    runs-on: ubuntu-latest

    # Runs the full suite, plus three checks nothing else in this repo covers.
    #
    # Shroud is the only demo where a cell holds data the *server* cannot read, and
    # that shape leans on parts of the library the other demos never touch: a cell
    # bound from a JSON controller with no LiveView socket, cross-cell fan-out where
    # a page opens one file per author, and a global Postgres resource on its own repo
    # module sitting alongside all of it. A library change that breaks any of those is
    # invisible to `console` and `collab_editor`.
    #
    # It is also the only place these three are checked at all:
    #
    #   * `zero_knowledge_test` asserts the plaintext is absent from the cell file
    #     after a checkpoint — which is only true with SQLCipher actually linked.
    #   * `test/js/run.sh` round-trips the browser's WebCrypto against Elixir's
    #     `:crypto`. Both halves can be individually correct and still disagree on
    #     SPKI framing or GCM tag placement, and the only symptom is a decryption
    #     failure with nothing logged. It needs node, hence the toolchain below.
    #   * `probes/ciphertext/probe.sh` proves a SQLCipher WAL frame carries no
    #     plaintext, which is what the crypto-shredding claim rests on.
    env:
      MIX_ENV: test
      EXQLITE_USE_SYSTEM: "1"
      EXQLITE_SYSTEM_CFLAGS: "-I/usr/include/sqlcipher"
      EXQLITE_SYSTEM_LDFLAGS: "-lsqlcipher"

    # The first job here to need Postgres: Shroud splits its data in two, with
    # server-visible index rows in Postgres and per-user encrypted content in cells.
    # Credentials match config/test.exs.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          path: ash_cell

      - uses: actions/checkout@v7
        with:
          repository: C-Sinclair/ash_sqlite
          ref: main
          path: ash_sqlite

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: ash_cell/.tool-versions
          version-type: strict

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Both packages, not just the dev headers the other demos need: the ciphertext
      # probe shells out to the `sqlcipher` CLI, which ships separately.
      - name: Install SQLCipher
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev sqlcipher

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            ash_cell/demos/shroud/deps
            ash_cell/demos/shroud/_build
          key: ${{ runner.os }}-demo-shroud-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('ash_cell/demos/shroud/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-demo-shroud-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Fetch dependencies
        working-directory: ash_cell/demos/shroud
        run: mix deps.get

      - name: Compile exqlite against SQLCipher
        working-directory: ash_cell/demos/shroud
        # `mix deps.compile` first is load-bearing, not belt-and-braces. On a fresh checkout
        # `mix deps.compile exqlite --force` fans out across Mix's parallel deps partition, and
        # the workers cannot find exqlite's own build dependencies -- `elixir_make`, `telemetry`
        # -- because nothing has compiled them yet, so the partition dies and takes the build
        # with it. Compiling everything once puts them in place.
        run: |
          mix deps.compile
          mix deps.compile exqlite --force

      - name: Check SQLCipher is linked
        working-directory: ash_cell/demos/shroud
        run: mix cipher.check

      - name: Check formatting
        working-directory: ash_cell/demos/shroud
        run: mix format --check-formatted

      - name: Compile
        working-directory: ash_cell/demos/shroud
        run: mix compile --warnings-as-errors

      - name: Test
        working-directory: ash_cell/demos/shroud
        run: mix test

      # Guards the config bug this job would otherwise hide: the test cell directory
      # is set in config/test.exs, and it was once silently overridden by a later line
      # in config.exs, pointing the suite at the dev fleet's cells.
      - name: Confirm tests wrote cells somewhere disposable
        working-directory: ash_cell/demos/shroud
        run: |
          test -d tmp/test_cells || { echo "no tmp/test_cells — is :cell_dir being overridden?"; exit 1; }
          test ! -d priv/cells || { echo "tests wrote into priv/cells"; exit 1; }

      - name: SQLCipher WAL carries no plaintext
        working-directory: ash_cell/demos/shroud
        run: ./probes/ciphertext/probe.sh

      - name: Browser and server crypto agree
        working-directory: ash_cell/demos/shroud
        run: ./test/js/run.sh

      # A smoke test rather than a benchmark. The published numbers come from a real
      # machine (docs/probes.md); a shared runner cannot produce comparable ones. What
      # this catches is the pull-model read path breaking outright.
      - name: Cell fan-out still works
        working-directory: ash_cell/demos/shroud
        run: mix run probes/checkout/run.exs 10

      - name: Build assets
        working-directory: ash_cell/demos/shroud
        run: |
          mix assets.setup
          mix assets.build
